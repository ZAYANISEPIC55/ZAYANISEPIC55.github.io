<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Just4Fun Castles</title>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- 🔐 LOGIN MODAL (FIXED LOCATION) -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">

    <h2>Login</h2>

    <button onclick="loginWithGoogle()">Continue with Google</button>

    <input id="emailInput" type="email" placeholder="Email" />
    <button onclick="loginWithEmail()">Continue with Email</button>

    <button onclick="closeLogin()">Close</button>

  </div>
</div>

<!-- 🔷 NAVBAR -->
<nav class="top-nav">

  <div class="nav-left">
    <a href="#">Just4Fun Castles</a>
  </div>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Castles</a>
    <a href="#">Contact</a>
  </div>

  <div class="nav-profile">

    <!-- FIXED: open modal instead of direct login -->
    <button id="loginBtn" onclick="openLogin()">Login</button>

    <div id="userMenu" class="hidden">

      <span id="userName"></span>

      <button onclick="toggleMenu()">☰</button>

      <div id="dropdown" class="dropdown hidden">

        <a href="#">Dashboard</a>
        <a href="#">Settings</a>

        <button onclick="logout()">Logout</button>

      </div>
    </div>

  </div>

</nav>

<!-- 🔷 MAIN -->
<main class="page">
  <h1>COMING SOON</h1>
</main>

<!-- 🔷 SCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>
