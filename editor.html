
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Editor</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <button onclick="addText()">Text</button>
  <button onclick="addBox()">Box</button>
  <button onclick="addImage()">Image</button>
  <button onclick="addPage()">Page</button>
  <button onclick="togglePreview()">Preview</button>
  <button onclick="exportSite()">Download</button>
</div>

<div class="layout">

  <div class="sidebar">
    <h3>Pages</h3>
    <div id="pages"></div>
    <h3>Templates</h3>
    <button onclick="loadTemplate('business')">Business</button>
    <button onclick="loadTemplate('portfolio')">Portfolio</button>
    <button onclick="loadTemplate('shop')">Shop</button>
  </div>

  <div class="canvasWrap">
    <div id="canvas" class="canvas"></div>
  </div>

  <div class="inspector">
    <h3>Inspector</h3>
    <input id="size" type="range" min="10" max="80" oninput="setSize(this.value)">
    <input id="color" type="color" oninput="setColor(this.value)">
    <button onclick="align('left')">Left</button>
    <button onclick="align('center')">Center</button>
    <button onclick="align('right')">Right</button>
  </div>

</div>

<script src="assets/editor.js"></script>
</body>
</html>
